name: bigdata-platform-lab-hadoop

x-hadoop-common: &hadoop-common
  image: bigdata-platform-lab/hadoop:3.5.0
  restart: unless-stopped
  networks:
    - hadoop

x-hadoop-environment: &hadoop-environment
  HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
  HADOOP_LOG_DIR: /var/log/hadoop

services:
  namenode:
    <<: *hadoop-common
    build:
      context: .
      dockerfile: Dockerfile
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-environment
      HDFS_NAMENODE_OPTS: -Xms256m -Xmx512m
    ports:
      - "9870:9870"
    volumes:
      - namenode-data:/var/lib/hadoop-hdfs/namenode
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  datanode-1:
    <<: *hadoop-common
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-environment
      HDFS_DATANODE_OPTS: -Xms128m -Xmx256m
    ports:
      - "9864:9864"
    volumes:
      - datanode-1-data:/var/lib/hadoop-hdfs/datanode
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck: &datanode-healthcheck
      test:
        [
          "CMD-SHELL",
          "pgrep -f org.apache.hadoop.hdfs.server.datanode.DataNode >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  datanode-2:
    <<: *hadoop-common
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-environment
      HDFS_DATANODE_OPTS: -Xms128m -Xmx256m
    ports:
      - "9865:9864"
    volumes:
      - datanode-2-data:/var/lib/hadoop-hdfs/datanode
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck: *datanode-healthcheck

  datanode-3:
    <<: *hadoop-common
    hostname: datanode-3
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-environment
      HDFS_DATANODE_OPTS: -Xms128m -Xmx256m
    ports:
      - "9866:9864"
    volumes:
      - datanode-3-data:/var/lib/hadoop-hdfs/datanode
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck: *datanode-healthcheck

  hdfs-init:
    <<: *hadoop-common
    profiles: ["yarn"]
    restart: "no"
    command: ["/opt/hadoop-lab/bin/initialize-hdfs.sh"]
    environment:
      <<: *hadoop-environment
    depends_on:
      datanode-1:
        condition: service_healthy
      datanode-2:
        condition: service_healthy
      datanode-3:
        condition: service_healthy

  resourcemanager:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    environment:
      <<: *hadoop-environment
      YARN_RESOURCEMANAGER_OPTS: -Xms256m -Xmx512m
    ports:
      - "8088:8088"
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f org.apache.hadoop.yarn.server.resourcemanager.ResourceManager >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  nodemanager-1:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: nodemanager-1
    command: ["yarn", "nodemanager"]
    environment:
      <<: *hadoop-environment
      YARN_NODEMANAGER_OPTS: -Xms128m -Xmx256m
    ports:
      - "8042:8042"
    depends_on: &nodemanager-dependencies
      resourcemanager:
        condition: service_healthy
    healthcheck: &nodemanager-healthcheck
      test:
        [
          "CMD-SHELL",
          "pgrep -f org.apache.hadoop.yarn.server.nodemanager.NodeManager >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  nodemanager-2:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: nodemanager-2
    command: ["yarn", "nodemanager"]
    environment:
      <<: *hadoop-environment
      YARN_NODEMANAGER_OPTS: -Xms128m -Xmx256m
    ports:
      - "8043:8042"
    depends_on: *nodemanager-dependencies
    healthcheck: *nodemanager-healthcheck

  nodemanager-3:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: nodemanager-3
    command: ["yarn", "nodemanager"]
    environment:
      <<: *hadoop-environment
      YARN_NODEMANAGER_OPTS: -Xms128m -Xmx256m
    ports:
      - "8044:8042"
    depends_on: *nodemanager-dependencies
    healthcheck: *nodemanager-healthcheck

  jobhistory:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: jobhistory
    command: ["mapred", "historyserver"]
    environment:
      <<: *hadoop-environment
      MAPRED_HISTORYSERVER_OPTS: -Xms128m -Xmx256m
    ports:
      - "19888:19888"
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f org.apache.hadoop.mapreduce.v2.hs.JobHistoryServer >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  client:
    <<: *hadoop-common
    profiles: ["tools"]
    restart: "no"
    command: ["bash"]
    environment:
      <<: *hadoop-environment
    volumes:
      - ./fixtures:/opt/hadoop-lab/fixtures:ro

networks:
  hadoop:
    driver: bridge

volumes:
  namenode-data:
  datanode-1-data:
  datanode-2-data:
  datanode-3-data:
